<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>台灣原生種生物大冒險</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="setup-panel">
        <div class="title-row">
          <span class="mark">富</span>
          <div>
            <label for="gameTitle">遊戲主題標題</label>
            <input id="gameTitle" type="text" value="台灣原生種生物大冒險" maxlength="24" />
          </div>
        </div>

        <div class="control-block">
          <label for="playerCount">比賽人數</label>
          <input id="playerCount" type="number" min="4" max="4" value="4" readonly />
        </div>

        <div class="control-block">
          <label>電子骰子</label>
          <div class="dice-box">
            <div id="diceFace" class="dice-face">1</div>
            <button id="rollDice" type="button">擲骰前進</button>
          </div>
          <p id="turnText" class="hint">輪到第 1 位玩家</p>
        </div>

        <div class="control-block">
          <div class="section-heading">玩家資料</div>
          <div id="playersList" class="players-list"></div>
        </div>
      </aside>

      <main class="game-area">
        <header class="game-header">
          <h1 id="displayTitle">台灣原生種生物大冒險</h1>
          <div id="leaderboard" class="leaderboard"></div>
        </header>

        <section id="board" class="board" aria-label="大富翁棋盤"></section>
      </main>

      <aside class="stage-panel">
        <div class="section-heading">關卡圖片設定</div>
        <div id="stageEditor" class="stage-editor"></div>
      </aside>
    </div>

    <dialog id="cameraDialog">
      <div class="camera-panel">
        <div class="dialog-title">拍攝玩家大頭照</div>
        <video id="cameraPreview" autoplay playsinline></video>
        <canvas id="avatarCanvas" width="240" height="240"></canvas>
        <div class="dialog-actions">
          <button id="closeCamera" type="button">取消</button>
          <button id="captureAvatar" type="button">拍照使用</button>
        </div>
      </div>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
