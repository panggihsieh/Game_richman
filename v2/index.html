<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>第二版 12道闖關測試</title>
    <link rel="stylesheet" href="styles.css?v=20260528-v2-auto-robot" />
  </head>
  <body>
    <div class="app">
      <aside class="setup-panel">
        <div class="title-row">
          <span class="mark">富</span>
          <div>
            <label for="gameTitle">遊戲主題標題</label>
            <input id="gameTitle" type="text" value="第二版 12道闖關測試" maxlength="24" />
          </div>
        </div>

        <div class="control-block">
          <label for="playerCount">比賽人數</label>
          <input id="playerCount" type="number" min="1" max="8" value="1" />
        </div>

        <div class="control-block">
          <label>電子骰子</label>
          <div class="dice-box">
            <div id="diceFace" class="dice-face">1</div>
            <button id="rollDice" type="button">擲骰前進</button>
          </div>
          <p id="turnText" class="hint">輪到第 1 位玩家</p>
        </div>

        <div class="control-block">
          <div class="section-heading">玩家資料</div>
          <div id="playersList" class="players-list"></div>
        </div>
      </aside>

      <main class="game-area">
        <header class="game-header">
          <h1 id="displayTitle">第二版 12道闖關測試</h1>
          <div class="game-header-tools">
            <button id="fullscreenToggle" class="fullscreen-toggle" type="button">全螢幕 on/off</button>
            <div id="leaderboard" class="leaderboard"></div>
          </div>
        </header>

        <section id="board" class="board" aria-label="大富翁棋盤">
          <div class="match-control" aria-label="比賽控制">
            <div class="timer-wheel" id="timerWheel">
              <label for="matchMinutes">比賽時間</label>
              <strong id="timerText">01:00</strong>
              <input id="matchMinutes" type="range" min="1" max="30" value="1" />
              <span id="timerHint">拖曳調整分鐘，時間到最高分為冠軍</span>
            </div>
            <div class="center-dice">
              <div id="centerDiceFace" class="center-dice-face">1</div>
              <button id="startMatch" type="button">正式開始比賽</button>
              <button id="emergencyStop" type="button">緊急停止</button>
              <button id="centerRollDice" type="button">擲骰前進</button>
            </div>
            <div class="robot-buddy" aria-label="像素小機器人助手">
              <div class="robot-antenna"></div>
              <div class="robot-head">
                <span class="robot-eye"></span>
                <span class="robot-eye"></span>
              </div>
              <div class="robot-body">
                <span></span>
                <span></span>
              </div>
            </div>
          </div>
        </section>
      </main>

      <aside class="stage-panel">
        <div class="section-heading">關卡圖片設定</div>
        <div id="stageEditor" class="stage-editor"></div>
      </aside>
    </div>

    <dialog id="cameraDialog">
      <div class="camera-panel">
        <div class="dialog-title">拍攝玩家大頭照</div>
        <video id="cameraPreview" autoplay playsinline></video>
        <canvas id="avatarCanvas" width="240" height="240"></canvas>
        <div class="dialog-actions">
          <button id="closeCamera" type="button">取消</button>
          <button id="captureAvatar" type="button">拍照使用</button>
        </div>
      </div>
    </dialog>

    <script src="app.js?v=20260528-v2-auto-robot"></script>
  </body>
</html>
